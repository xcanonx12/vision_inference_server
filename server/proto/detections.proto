syntax = "proto3";

package simpleinference;

service InferenceService {
  rpc Predict (InferenceRequest) returns (InferenceResponse) {}
  rpc StreamPredict (stream InferenceRequest) returns (stream InferenceResponse) {}
  rpc GetServerConfig (Empty) returns (ServerConfigResponse) {}
}

message Empty {}

message InferenceRequest {
  bytes image_data = 1;
  int32 width = 2;
  int32 height = 3;
}

message InferenceResponse {
  repeated Detection detections = 1;
  int32 image_width = 2;
  int32 image_height = 3;
  float inference_time_ms = 4;
}

message Detection {
  float x1 = 1;
  float y1 = 2;
  float x2 = 3;
  float y2 = 4;
  float confidence = 5;
  int32 class_id = 6;
  string class_name = 7;
}

message ServerConfigResponse {
  string model_name = 1;
  string model_type = 2;
  string backend = 3;
  int32 input_width = 4;
  int32 input_height = 5;
  string version = 6;
  string device = 7;
}
