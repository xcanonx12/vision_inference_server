services:
  inference-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "50051:50051"
      - "8080:8080"
    volumes:
      - ./models:/models
      - ./server/config.yaml:/app/server/config.yaml
    environment:
      - ROBOFLOW_API_KEY=${ROBOFLOW_API_KEY:-}
